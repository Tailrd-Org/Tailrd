name: Scrape Jobs

on:
  schedule:
    # "Hourly", twice. A run costs the database well under 1 MB: every dedup
    # site is a column query (`SELECT scraped_jobs.url`), verified against prod.
    #
    # The Neon transfer overage was never this workflow. It was a stale
    # resumate-scraper deployment connecting straight to Neon with the DB
    # password, running a pre-2026-05-11 ScrapedJob model whose dedup fetched
    # whole rows (~6,000 x ~2.3 KB = ~14 MB every hour). Killed on 2026-07-13
    # by rotating the neondb_owner password; it had also been the source of
    # ~all new jobs since 2026-06-26, so cron-ats now carries the feed.
    #
    # Off-peak minutes, never 0: GitHub fires scheduled workflows on a shared
    # queue and top-of-hour is its most contended slot, fires there get
    # delayed or silently dropped (the 00:00Z and 02:00Z fires on 2026-07-13
    # never ran at all). Even at minute 17 the schedule delivered only ~5.7
    # runs a day from 2026-08-27 (23/day before), so a second entry at :47
    # doubles the chances; the concurrency group below keeps two deliveries
    # from ever crawling at the same time, and every per-run budget is sized
    # for the irregular cadence (least-recently-crawled shard,
    # least-recently-probed verification).
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

# Least privilege: the job token can only read this repo. What uses it:
#   - actions/checkout clones the repo: contents: read. The token is not
#     persisted into .git/config (persist-credentials: false); nothing after
#     checkout runs git against the remote.
#   - the inactivity check reads the default branch and its newest commit
#     through the REST API: contents: read (metadata is always granted).
#   - actions/setup-python only fetches its public version manifest.
# Nothing else touches it: the scrapers and the endpoint steps authenticate
# to Tailrd with CRON_SECRET, never with the GitHub token.
permissions:
  contents: read

# One run at a time. A delivery that lands while a run is in flight waits
# (cancel-in-progress: false), so a crawl is never cut off half way and two
# runs never double-crawl the same shard or double-probe the same rows.
concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19, and this
    # job runs unattended every hour: move it deliberately, not on GitHub's
    # schedule.
    runs-on: ubuntu-24.04
    # A normal run takes 7-8 minutes; the steps' own caps add up to ~35.
    # Anything longer is hung and would block the concurrency group.
    timeout-minutes: 40
    env:
      API_BASE: https://www.tailrd.ca
    steps:
      # Inactivity check. GitHub disables scheduled workflows in a public repo
      # after 60 days without a commit, and says nothing: this is exactly how
      # the external scraper's "Hourly Job Scraper" stopped on 2026-08-26. A
      # disabled workflow can't warn about itself, so from day 50 this step
      # fails and the last step turns the run red (a failed scheduled run
      # emails the maintainer), which leaves ~10 days to push a commit or to
      # move scheduling to an external cron (docs/ingestion-pipeline.md,
      # "Schedules"). A commit's committer date is at or before its push, so
      # the alarm can come early but never late.
      #
      # There is deliberately no automatic re-enable or keepalive commit. It
      # is unconfirmed that toggling the workflow resets GitHub's timer,
      # GitHub has blocked keepalive tooling on ToS grounds, and the toggle
      # needed actions: write on a job that runs third-party PyPI code.
      - name: Check the 60-day inactivity clock
        id: inactivity
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ALERT_AFTER_DAYS: 50
        run: |
          if ! branch=$(gh api "repos/$REPO" --jq .default_branch) || [ -z "$branch" ] ||
             ! last=$(gh api "repos/$REPO/commits/$branch" --jq .commit.committer.date) || [ -z "$last" ]; then
            echo "::error::Could not read the newest commit on the default branch, so the 60-day inactivity check did not run."
            exit 1
          fi
          last_s=$(date -u -d "$last" +%s)
          now_s=$(date -u +%s)
          age=$(( (now_s - last_s) / 86400 ))
          off=$(date -u -d "@$(( last_s + 60 * 86400 ))" +%Y-%m-%d)
          echo "newest commit on $branch: $last ($age days ago); without a new commit GitHub disables this schedule around $off"
          if [ "$age" -ge "$ALERT_AFTER_DAYS" ]; then
            echo "::error::The newest commit on $branch is $age days old. GitHub disables scheduled workflows in a public repo after 60 days without a commit, silently, so ingestion stops around $off. Push any commit to $branch to reset the clock, or move scheduling to an external cron (docs/ingestion-pipeline.md, Schedules)."
            exit 1
          fi

      # JobSpy + LinkedIn were parked from e1177e6 until the batched ingest
      # endpoint existed: they used to POST /jobs/create once per job with no
      # auth, and every request 401'd. They now collect everything and POST
      # /jobs/ingest-batch in chunks of 100 with the cron secret: a handful
      # of authenticated requests per run instead of thousands of dead ones.
      # They stay continue-on-error: LinkedIn and Indeed block scrapers often
      # enough that a red run from them would drown out a real outage.
      #
      # persist-credentials: false makes checkout strip its token inside this
      # step, and that cleanup runs `git submodule foreach`. Any gitlink with
      # no .gitmodules entry then fails the step (exit 128, "No url found for
      # submodule path"), which skips Python setup and both scrapers. Two
      # such orphans (resumate-scraper, reference/AutoApplyMax) broke every
      # run from f26fa4c until they were removed; keep nested clones out of
      # the index (.gitignore).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned to what this job resolved as of 2026-09 (the latest releases
      # then). The scripts run with CRON_SECRET in their env, so a new PyPI
      # release must not reach them unreviewed: bump these deliberately.
      - name: Install dependencies
        run: pip install python-jobspy==1.1.82 httpx==0.28.1
      - name: Run JobSpy scraper (Indeed + LinkedIn)
        run: python scripts/scrape_jobspy.py
        continue-on-error: true
        timeout-minutes: 6
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Run LinkedIn guest API scraper
        run: python scripts/scrape_linkedin.py
        continue-on-error: true
        timeout-minutes: 6
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Every endpoint call below prints its HTTP status, time and response
      # body, and fails its step on anything but 2xx. The steps are
      # continue-on-error so one failing endpoint never stops the rest of the
      # run; the last step turns the run red if any of them failed. Before
      # this, every curl ended in `|| true`, so a 401 or 500 showed green.
      #
      # --max-time 300 on the four crons = Vercel's function limit. The
      # server-side budgets all finish well inside it: cron-ats pages boards
      # for at most CRON_ATS_LIST_BUDGET_SECONDS (150 s) plus processing;
      # cron-backfill plans its whole pass into BACKFILL_BUDGET_S (240 s):
      # up to 75 s of descriptions, then a logo harvest of what is left (at
      # most 150 s); cron-freshness runs its sweeps plus a 150 s
      # verification box.
      # A curl timeout at 300 s therefore means the function itself hit
      # Vercel's ceiling, which is worth a red run. Never raise it past 300:
      # Vercel kills the function there anyway.
      #
      # cron-ats and the daily v2 runner (ingest.yml) crawl the same registry.
      # Until INGEST_V2_RUNNER=1 is set on Vercel (a changed env var needs a
      # redeploy; it is never set in this workflow) cron-ats crawls its shard
      # as it always has. With the flag on it leaves every board crawled in
      # the last 20 hours to the runner and counts them in "boards_skipped_v2",
      # so a response that skipped its whole shard is the cut-over working, not
      # a fault, and a board the runner missed is picked up here after 20 hours.
      - name: Trigger ATS scraper
        id: cron_ats
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          rm -f response.json
          code=$(curl -sS -X POST "$API_BASE/github-sources/cron-ats" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -o response.json -w '%{http_code} %{time_total}s' \
            --max-time 300) || code="000 curl-exit-$?"
          echo "HTTP $code"
          head -c 6000 response.json 2>/dev/null || true; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac

      # cron-poll also runs the match-alert sweep (the deterministic fit engine,
      # no AI), which answers 200 even when it cannot score: FIT_TRACE_SALT is
      # unset or too short ("fit_trace_salt_missing":true, nothing is banked,
      # so the feed shows no scores and no alert goes out) or the engine
      # cannot be built ("status":"engine_unavailable"). Either gets a warning
      # annotation on every run's summary, deliberately not a failure: a red
      # scheduled run would email the owner every few hours until it is fixed.
      # Setting MATCH_ALERTS_ENABLED=false turns the sweep (and this warning) off.
      - name: Trigger GitHub aggregator
        id: cron_poll
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          rm -f response.json
          code=$(curl -sS -X POST "$API_BASE/github-sources/cron-poll" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -o response.json -w '%{http_code} %{time_total}s' \
            --max-time 300) || code="000 curl-exit-$?"
          echo "HTTP $code"
          head -c 6000 response.json 2>/dev/null || true; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac
          if grep -q '"fit_trace_salt_missing":true' response.json 2>/dev/null; then
            echo "::warning title=Match scoring stopped::FIT_TRACE_SALT is missing or shorter than 16 bytes on the API, so the match sweep banked no scores: the feed shows none and no match alert goes out. Set it in the Vercel environment (a secret of at least 16 random bytes). MATCH_ALERTS_ENABLED=false stops the sweep deliberately."
          elif grep -q '"status":"engine_unavailable"' response.json 2>/dev/null; then
            reason=$(grep -o '"status":"engine_unavailable".*' response.json | grep -o '"error":"[^"]*"' | head -n 1 | cut -d '"' -f 4 || true)
            echo "::warning title=Match scoring stopped::The fit engine could not be built (${reason:-see match_alerts.error above}), so the match sweep scored nothing. Check the deploy's match-engine data against its MANIFEST. MATCH_ALERTS_ENABLED=false stops the sweep deliberately."
          fi

      - name: Backfill descriptions + locations + logos
        id: cron_backfill
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          rm -f response.json
          code=$(curl -sS -X POST "$API_BASE/jobs/cron-backfill" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -o response.json -w '%{http_code} %{time_total}s' \
            --max-time 300) || code="000 curl-exit-$?"
          echo "HTTP $code"
          head -c 6000 response.json 2>/dev/null || true; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac

      # Lifecycle: age out rows nothing re-confirms (stale, terminal and
      # aggregator expiry), check unconfirmed rows against each platform's
      # own API (Workday CXS, SmartRecruiters, Greenhouse, Lever, Ashby,
      # Oracle), refresh ghost-risk scores. Removal of jobs that vanished
      # from their board already happened inside cron-ats reconciliation.
      - name: Freshness sweep (expiry + verification + ghost scoring)
        id: cron_freshness
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          rm -f response.json
          code=$(curl -sS -X POST "$API_BASE/jobs/cron-freshness" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -o response.json -w '%{http_code} %{time_total}s' \
            --max-time 300) || code="000 curl-exit-$?"
          echo "HTTP $code"
          head -c 6000 response.json 2>/dev/null || true; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac

      # Snapshot pipeline health into the workflow log so a broken board or a
      # feed drop is visible without opening the database. Runs even when an
      # earlier step failed: that is when the snapshot matters most.
      - name: Log ingest metrics
        id: ingest_metrics
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          rm -f response.json
          code=$(curl -sS "$API_BASE/jobs/ingest-metrics" \
            -H "x-cron-secret: $CRON_SECRET" \
            -o response.json -w '%{http_code} %{time_total}s' \
            --max-time 60) || code="000 curl-exit-$?"
          echo "HTTP $code"
          head -c 12000 response.json 2>/dev/null || true; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac

      # continue-on-error keeps a failed step from stopping the run but also
      # leaves the job green; this step makes any endpoint failure, and the
      # inactivity alarm, visible.
      - name: Fail the run if a checked step failed
        if: ${{ !cancelled() }}
        env:
          OUTCOMES: >-
            inactivity=${{ steps.inactivity.outcome }}
            cron-ats=${{ steps.cron_ats.outcome }}
            cron-poll=${{ steps.cron_poll.outcome }}
            cron-backfill=${{ steps.cron_backfill.outcome }}
            cron-freshness=${{ steps.cron_freshness.outcome }}
            ingest-metrics=${{ steps.ingest_metrics.outcome }}
        run: |
          echo "$OUTCOMES" | tr ' ' '\n'
          failed=$(echo "$OUTCOMES" | tr ' ' '\n' | grep -v '=success$' | tr '\n' ' ' || true)
          if [ -n "$failed" ]; then
            echo "::error::step(s) failed: $failed"
            exit 1
          fi
