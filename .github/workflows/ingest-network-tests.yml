name: Ingest network tests

# The scraper v2 tests that call live job boards (marked `network`, registered
# in pyproject.toml). ci.yml deselects them, because a pull request must not
# depend on a board being up. They run here every night instead, so a board
# that changed its API, or an adapter that stopped listing jobs, turns a
# scheduled run red and emails the maintainer within a day, rather than
# showing up weeks later as a quiet drop in the feed.
#
# No database credential here, ever: the tests run on SQLite, as ci.yml's do,
# and the only secrets are the optional keys of the keyed adapters (USAJOBS,
# Adzuna, Jooble). A key that is not set arrives empty, which switches that
# adapter off, and its test skips; `-rs` below lists every skip with its reason.

on:
  schedule:
    # Nightly at 03:41 UTC (23:41 in Toronto and New York), ahead of the day's
    # ingest.yml run at 06:23 so the two never page the same job boards at the
    # same time. An off-peak minute, never 0: GitHub fires scheduled workflows
    # from a shared queue whose top-of-hour slot is the most contended, and
    # fires there get delayed or silently dropped.
    - cron: '41 3 * * *'
  workflow_dispatch:

# Least privilege: the job token can only read this repo (actions/checkout
# clones it; nothing after checkout runs git against the remote, and the token
# is not persisted into .git/config).
permissions:
  contents: read

# One run at a time; a delivery that lands while one is in flight waits, so a
# run is never cut off half way and the boards are never asked twice at once.
concurrency:
  group: ingest-network-tests
  cancel-in-progress: false

jobs:
  network:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19. Move this
    # deliberately, not on GitHub's schedule.
    runs-on: ubuntu-24.04
    # The tests pace themselves at one request a second per host; a run takes
    # a few minutes. Anything longer is hung.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # 3.12 is what Vercel and the ingest runner run.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Test-only deps not needed at runtime, as in ci.yml.
          pip install pytest hypothesis reportlab
      # Every test of the repo is collected and only the marked ones run, so a
      # network test added outside backend/tests/ingest is picked up too.
      - name: Run the network tests
        env:
          RUN_NETWORK_TESTS: '1'
          # SQLite, so these tests never touch a Neon branch.
          DATABASE_URL: 'sqlite:///./ci_test.db'
          JWT_SECRET: 'ci-test-secret-not-used-in-prod'
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python -m pytest backend/tests -m network -q -rs
