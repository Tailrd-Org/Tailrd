<title>Manager, Insights and Reporting</title>
<script type="application/ld+json">{"hiringOrganization":{"@type":"Organization","name":"Mackenzie Financial Corporation","sameAs":"www.mackenziefinancial.com"},"validThrough":"2026-11-02T05:00:00.000Z","jobLocation":[{"address":{"addressCountry":"CA","streetAddress":"UNAVAILABLE","@type":"PostalAddress","postalCode":"UNAVAILABLE","addressLocality":"Greater Toronto Area","addressRegion":"ON","postOfficeBoxNumber":"UNAVAILABLE"},"@type":"Place"}],"employmentType":"OTHER","@type":"JobPosting","description":"<h2>Job Description<\/h2>\n<p><strong>Referral Level: Level 1<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Mackenzie Investments&nbsp;<\/strong>&nbsp;<\/p>\n<p>IGM Financial Inc. is a leading wealth and asset management company in Canada, managing approximately&nbsp;$310&nbsp;billion&nbsp;in assets&nbsp;as of December 31, 2025. It offers financial planning and investment services to over two million Canadians through IG Wealth Management and Mackenzie Investments.&nbsp;<\/p>\n<p>Mackenzie Investments, founded in 1967, is a key part of IGM's business model, serving as a comprehensive asset-management partner for Canadian financial advisors and their clients.&nbsp;<\/p>\n<p><strong>At Mackenzie Investments You Can Build Your Career with Confidence.&nbsp;<\/strong>We are proud to be recognized as one of Canada\u2019s Top 100 Employers for the fourth consecutive year and one of Canada\u2019s Best Diversity Employers. Our vision and strategy aim to innovate the industry and support Canadians in achieving their financial goals.&nbsp;<\/p>\n<p>Join our team to engage in continuous learning and skill development in a supportive environment.&nbsp;Experience the best of both worlds with our hybrid work environment, where you spend three days a week in the office, connecting, collaborating, and enjoying quality time with your amazing colleagues!&nbsp;&nbsp;Our Values: Be better;&nbsp;we strive for improvement in everything we do.&nbsp;Be accountable;&nbsp;we foster clarity and are empowered to act responsibly.&nbsp;Be a team;&nbsp;we are united to drive collective impact to achieve our goals.&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Department Overview:<\/strong><\/p>\n<p><strong>&nbsp;<\/strong><\/p>\n<p>As part of Operations Support Services, the Knowledge Management (KM) team serves as a Centre of Excellence (COE) for content and knowledge management at IGM. The team helps employees quickly find, access, and trust the information they need to serve clients and support business operations.<\/p>\n<p>&nbsp;<\/p>\n<p>The KM team manages knowledge platforms, enterprise search experiences, content governance, analytics, and digital modernization initiatives. Working closely with partners across IGM, the team establishes best practices and governance frameworks that improve information quality, enhance the employee experience, and drive operational efficiency.<\/p>\n<p>&nbsp;<\/p>\n<p>This is an exciting opportunity to be part of a team that is transforming how knowledge is managed, discovered, and leveraged across the organization through modern digital workplace, content, and AI-enabled solutions.<\/p>\n<p><strong>&nbsp;<\/strong><\/p>\n<p><strong>Position Overview<\/strong><\/p>\n<p>&nbsp;<\/p>\n<p>We are seeking a Reporting and Insights Manager to help shape the future of knowledge and content management at IGM. In this role, you will lead the evolution of a machine learning search engine (Coveo) and a Content Management System (CMS), driving search optimization, platform enhancements, analytic, and AI-enabled solutions that improve how employees discover and use information.<\/p>\n<p>&nbsp;<\/p>\n<p>As a key member of the Knowledge Management team, you will advance our knowledge strategy, deliver data-driven insights, and support initiatives to modernize our CMS that enhance the employee experience and operational efficiency across the enterprise.<\/p>\n<p>&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Search Engine (Coveo) and Content Management System (CMS \u2013 SharePoint) Management<\/strong><\/p>\n<ul>\n <li><strong>Reporting, dashboards and analytics:<\/strong> Develop, maintain and publish dashboards and reports using tools such as PowerBI and Coveo usage analytics. Translate data on usage, search performance, and content engagement into actionable insights that strengthen AI search relevancy, content governance and decision making. <\/li>\n <li><strong>Release implementation<\/strong>: Lead the deployment of Coveo releases and CMS updates. Integrate Coveo with platforms like Salesforce, and SharePoint, develop new features, and optimize existing functionalities to support the content lifecycle process. <\/li>\n <li><strong>Maintenance<\/strong>: Perform regular updates, troubleshooting, and performance monitoring of Coveo and CMS platforms. Ensure seamless operation by addressing technical issues and applying system enhancements.<\/li>\n <li><strong>Search Experience:<\/strong> Drive continuous improvements to enhance search capabilities, including relevancy tuning, query pipeline optimization, metadata configuration to improve content discoverability.<\/li>\n <li><strong>Content Experience:<\/strong> Improve content and knowledge experiences by applying information architecture, taxonomy, content organization, page design, and content usability best practices to ensure information is intuitive, accessible, and easy to find.<\/li>\n <li><strong>Collaboration:<\/strong> Partner with developers, product owners, and business stakeholder to identify content gaps, search deficiencies, and opportunities for platform innovation<\/li>\n <li><strong>Training and Support:<\/strong> Deliver training and user support for CMS and Coveo platforms, ensuring teams can efficiently access and manage knowledge assets<\/li>\n <li><strong>Documentation<\/strong>: Maintain detailed documentation of Coveo configurations, CMS workflows, deployment processes and best practices. <\/li>\n <li><strong>Compliance and Security:<\/strong> Ensure adherence to security protocols and regulatory standards. Implement measures to safeguard content integrity, confidentiality and availability. Consultation expertise<\/li>\n <li>Serve the Center of Excellence (CoE) for KM, offering guidance on AI-powered search and CMS strategy.<\/li>\n <li>Represent the KM team on cross-functional committees and working groups<\/li>\n <li>Design and execute KM initiatives that capture tactic knowledge and promote a collaborative, knowledge-sharing culture across business units. <\/li>\n<\/ul>\n<p><strong>Qualifications: <\/strong><\/p>\n<ul>\n <li>Bachelor\u2019s degree in information technology, knowledge management, or a related field<\/li>\n <li>5+ years\u2019 experience in content management system (CMS) (e.g., Modern SharePoint, Confluence) with a deep knowledge of publishing workflows and governance.<\/li>\n <li>Proven experience deploying and maintaining AI-powered search engines like Coveo including <\/li>\n <li>Search configuration, query pipeline design, and relevance tuning<\/li>\n <li>Integration with platforms such as Salesforce and SharePoint<\/li>\n <li>Using Coveo APIs, analytic dashboards and machine learning models<\/li>\n <li>Proficiency in web technologies: HTML, CSS, JavaScript, and web publishing standards<\/li>\n <li>Proficient in Power BI for data visualization, performance reporting, and enabling data-driven decisions. <\/li>\n <li>Understanding of machine learning, and natural language processing (NLP) concepts as applies to search and content personalization <\/li>\n <li>Strong analytical skills in content performance evaluation and user behavior analysis <\/li>\n <li>Excellent verbal and written communications skills with the ability to translate technical concepts into user-friendly content. <\/li>\n <li>Familiarity with Salesforce and its integration with search and content platforms is an asset<\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<p>&nbsp;<\/p>&nbsp;\n<p>&nbsp;<\/p>\n<p>The expected annual base salary range for this role is $73,000 - $95,000, which is determined based on skills, knowledge and experience and geographic location. In addition to base salary, this role is eligible for annual short-term incentive, health and well-being benefits, retirement and savings plan, paid time off and career development.&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p><strong>Benefits:&nbsp;&nbsp;<\/strong><\/p>\n<ul>\n <li><p><strong>COMPETITIVE COMPENSATION &amp; RECOGNITION<\/strong>: competitive base salary, performance-weighted bonus, education/career support, option to join Employee Share Purchase Plan with employer matching component.&nbsp;<\/p><\/li>\n<\/ul>\n<ul>\n <li><p><strong>EMPLOYEE BENEFITS &amp; INSURANCE:&nbsp;<\/strong>competitive health and dental coverage, flexible plan for you and your family and short-term &amp; long-term disability plans.<\/p><\/li>\n<\/ul>\n<ul>\n <li><p><strong>RETIREMENT SAVINGS PROGRAMS<\/strong>: voluntary Defined Contribution Pension Plan&nbsp;<\/p><\/li>\n<\/ul>\n<ul>\n <li><p><strong>WORK LIFE BALANCE<\/strong>: paid volunteer days, competitive time off, including 10 wellness days off, WorkPerks discount program, hybrid &amp; flex work arrangements.&nbsp;<\/p><\/li>\n<\/ul>\n<ul>\n <li><p><strong>INCLUSIVE CULTURE AND DIVERSITY<\/strong>: living our core values: Be a Team, Be Accountable, Be Better, engaging with community through Business Resource Groups (BRG communities are volunteer employee-led groups formed around a common interest, identity, or background).&nbsp;&nbsp;<\/p><\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p>IGM is a diverse workplace committed to doing business inclusively - this starts with having a representative workforce! We encourage applications from all qualified candidates that represent the diversity present across Canada \u2013 including racialized persons, women, Indigenous persons, persons with disabilities, 2SLGBTQIA+ community, gender diverse and neurodiverse individuals, as well as all who may contribute to the further diversification of ideas.&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p>Mackenzie Investments is an accessible employer committed to providing&nbsp;barrier-free recruitment experience. If you require accommodation or this information in an alternate format at any stage of the recruitment process, please reach out to the Talent Acquisition team who will work with you to meet your needs.&nbsp;&nbsp;&nbsp;&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p><strong>How to Apply:<\/strong>&nbsp;Interested candidates are invited to submit their resume and a cover letter detailing their qualifications and experience to&nbsp;<strong>https://www.mackenzieinvestments.com/en/careers<\/strong>.&nbsp;&nbsp;<\/p>\n<p><strong>Artificial Intelligence in Recruitment:&nbsp;<\/strong>As part of our Talent Acquisition process, we may use artificial intelligence and automated tools to support activities such as candidate sourcing, application review, and interview scheduling.&nbsp;These tools support the recruitment process; all hiring decisions are made by people.&nbsp;<\/p>\n<p>We thank all applicants for their interest in Mackenzie Investments; however, only those candidates selected for an interview will be contacted.&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<p>Please apply by November 2 2026.<\/p>\n<p>#LI-JS2&nbsp;<\/p>\n<p>#LI-Hybrid&nbsp;<\/p>\n<p>&nbsp;<\/p>","directApply":true,"datePosted":"2026-10-23T04:00:00.000Z","title":"Manager Insights and Reporting","@context":"http://schema.org","url":"https://careersen-mackenzieinvestments.icims.com/jobs/6075/manager-insights-and-reporting/job"}</script>
