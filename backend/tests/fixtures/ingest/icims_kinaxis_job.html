<title>Senior Payroll Specialist</title>
<script type="application/ld+json">{"hiringOrganization":{"@type":"Organization","name":"Kinaxis Inc.","sameAs":"Kinaxis.com"},"validThrough":"2027-10-23T04:00:00.000Z","jobLocation":[{"address":{"addressCountry":"CA","streetAddress":"3199 Palladium Drive","@type":"PostalAddress","postalCode":"K2T 0N9","addressLocality":"Ottawa","addressRegion":"ON","postOfficeBoxNumber":"UNAVAILABLE"},"@type":"Place"}],"employmentType":"FULL_TIME","@type":"JobPosting","description":"<h2><\/h2>\n<p><\/p>\n<p>About Kinaxis<\/p>\n<p>Are you looking to join an innovative, market-leading company where you can truly elevate your career? At Kinaxis we are serious about culture, we are serious about technology, we are serious about customers, and we are serious about not taking ourselves too seriously. If you are looking to be part of an incredible growth story, then we might just be the place for you!<\/p>\n<p>&nbsp;<\/p>\n<p>In 1984, we started out as a team of three engineers. Today, we have grown to become a global organization with over 2000 employees around the world, 6 global office and a best-in-class HQ in Ottawa, Canada. As winners of several Top Employer awards globally, we are proud to work with our customers and employees towards solving some of the biggest challenges facing supply chains today.<\/p>\n<p>&nbsp;<\/p>\n<p>Kinaxis is a global leader in modern supply chain orchestration, powering complex global supply chains, and supporting the people who manage them. Our powerful, AI infused platform provides full transparency and visibility across end-to-end supply chains, enabling our customers to make faster, better decisions. We are trusted by renowned global brands to provide the agility and predictability needed to navigate today\u2019s volatility and disruption. With more than 40,000 users in over 100 countries, we are expanding our team as we continue to innovate and revolutionize how we support our customers.<\/p>\n<h2><\/h2>\n<p>Location<\/p>\n<p>Hybrid, 3 days/week at our office in Ottawa, Canada&nbsp;<\/p>\n<p>About the role<\/p>\n<p>We are seeking a highly experienced Senior Payroll Specialist to support payroll operations across Canada, the United States, and multiple international jurisdictions.<\/p>\n<p>&nbsp;<\/p>\n<p>The successful candidate will be responsible for the accurate and timely processing, reconciliation, compliance, and administration of payroll programs for a global workforce. This individual will serve as a subject matter expert on payroll legislation, taxation, benefits, statutory reporting, auditing, payroll accounting, and payroll system administration while partnering closely with Human Resources, Finance, Benefits, Tax, and external payroll providers.<\/p>\n<p>&nbsp;<\/p>\n<p>This role is ideal for an experienced payroll professional who thrives in a complex, multinational environment and enjoys solving challenging payroll and compliance issues.<\/p>\n<h2><\/h2>\n<p>Salary Range<\/p>\n<p>&nbsp;Annual cash compensation ranges from $80,000 to $90,000, plus a discretionary 10% company bonus. The final offer within this range will reflect the successful candidate\u2019s skills and experience. <\/p>\n<p>Vacancy Status<\/p>\n<p> This is an existing job vacancy <\/p>\n<p>What you will do<\/p>\n<h2>Payroll Processing and Administration<\/h2>\n<ul>\n <li>Assist with processing payrolls for Canada, the United States, and international entities in accordance with local legislative requirements and company policies.<\/li>\n <li>Validate payroll inputs, earnings, deductions, taxes, benefits, commissions, bonuses, stock transactions, and retroactive adjustments.<\/li>\n <li>Review payroll outputs and investigate discrepancies prior to payroll approval and transmission.<\/li>\n <li>Support payroll activities related to hires, terminations, leaves of absence, promotions, transfers, and compensation changes.<\/li>\n <li>Ensure payrolls are completed accurately and within established service level timelines.<\/li>\n<\/ul>\n<h2>Global Payroll Vendor Coordination<\/h2>\n<ul>\n <li>Submit payroll changes and supporting documentation to local payroll providers.<\/li>\n <li>Review payroll results received from service providers and resolve discrepancies.<\/li>\n<\/ul>\n<h2>Compliance and Statutory Reporting<\/h2>\n<ul>\n <li>Ensure compliance with payroll legislation, taxation requirements, social security programs, and statutory regulations.<\/li>\n <li>Prepare and review payroll remittances and year-end reporting obligations.<\/li>\n <li>Support audits, tax inquiries, and compliance reviews.<\/li>\n <li>Maintain payroll procedures and process documentation.<\/li>\n <li>Monitor legislative changes and assist with implementation of payroll-related updates.<\/li>\n<\/ul>\n<h2>Benefits and Retirement Plans<\/h2>\n<ul>\n <li>Administer payroll-related deductions and company contributions for retirement and benefit programs.<\/li>\n <li>Prepare and reconcile pension, savings plan, and benefit remittances.<\/li>\n <li>Coordinate deductions and enrollment changes with benefit providers.<\/li>\n <li>Investigate and resolve deduction variances and employee inquiries.<\/li>\n<\/ul>\n<h2>Payroll Accounting and Reconciliations<\/h2>\n<ul>\n <li>Prepare payroll reconciliations and validate payroll-related financial transactions.<\/li>\n <li>Reconcile payroll registers to general ledger accounts.<\/li>\n <li>Support month-end and year-end close activities.<\/li>\n <li>Prepare payroll journal entries and supporting documentation.<\/li>\n <li>Investigate and resolve outstanding payroll-related balance sheet items.<\/li>\n<\/ul>\n<h2>Audit and Internal Controls<\/h2>\n<ul>\n <li>Prepare documentation supporting internal and external audit requirements.<\/li>\n <li>Maintain payroll controls and support control testing activities.<\/li>\n <li>Ensure payroll transactions are appropriately documented and traceable.<\/li>\n <li>Assist with payroll process reviews and compliance assessments.<\/li>\n<\/ul>\n<h2>Systems and Process Improvement<\/h2>\n<ul>\n <li>Act as a subject matter expert for payroll systems, interfaces, and reporting tools.<\/li>\n <li>Identify opportunities to improve efficiency, accuracy, and automation.<\/li>\n <li>Develop and maintain payroll reports, reconciliation tools, and process documentation.<\/li>\n<\/ul>\n<h2>Employee and Stakeholder Support<\/h2>\n<ul>\n <li>Respond to complex payroll-related inquiries from employees, HR, Finance, and management.<\/li>\n <li>Explain payroll calculations, deductions, tax implications, and statutory requirements.<\/li>\n <li>Provide guidance on payroll policies and procedures.<\/li>\n <li>Build collaborative relationships with internal and external stakeholders.<\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<p>What we are looking for<\/p>\n<p><strong>Primary Skills and Qualifications<\/strong><\/p>\n<p>&nbsp;<\/p>\n<ul>\n <li>Extensive payroll experience in progressively responsible payroll roles.<\/li>\n <li>Extensive experience processing payroll in Canada.<\/li>\n <li>Experience with ADP Workforce Now.<\/li>\n <li>Strong knowledge of payroll legislation, taxation, year-end processing, and statutory reporting.<\/li>\n <li>Experience with payroll reconciliations, accounting entries, and financial controls.<\/li>\n <li>Excellent analytical, organizational, and problem-solving abilities.<\/li>\n <li>Strong attention to detail and commitment to accuracy.<\/li>\n <li>Ability to effectively engage stakeholders and utilize available resources to obtain information needed for accurate payroll decisions.<\/li>\n<\/ul>\n<h2>Preferred<\/h2>\n<ul>\n <li>Payroll Compliance Practitioner (PCP) designation or equivalent.<\/li>\n <li>Experience with SuccessFactors, Workday, or similar HRIS systems.<\/li>\n <li>Experience supporting publicly traded organizations.<\/li>\n <li>Experience with NetSuite or other ERP platforms.<\/li>\n <li>Advanced Microsoft Excel skills.<\/li>\n<\/ul>\n<p>&nbsp;<\/p>\n<p><strong> #Senior<\/strong>;&nbsp;<\/p>\n<p>&nbsp;<\/p>\n<h2><\/h2>\n<p><strong>Work With Impact:<\/strong> Our platform directly helps companies power the world\u2019s supply chains. We see the results of what we do out in the world every day, when we see store shelves stocked, when medications are available for our loved ones, and so much more.<\/p>\n<p><strong>Work with Fortune 500 Brands:<\/strong> Companies across industries trust us to help them take control of their integrated business planning and digital supply chain. Some of our customers include Lockheed Martin, Unilever, P&amp;G, ExxonMobil, Cisco and more.<\/p>\n<p><strong>Social Responsibility at Kinaxis:<\/strong> Our Diversity, Equity, and Inclusion Committee weighs in on hiring practices, talent assessment training materials, and mandatory training on unconscious bias and inclusion fundamentals. Sustainability is key to what we do and we\u2019re committed to a long-term net-zero operations strategy. We are involved in our communities and support causes where we can make the most impact.<\/p>\n<p><em>People matter<\/em> at Kinaxis and here are some of the perks and benefits we offer, which may vary by location and employee:<\/p>\n<ul>\n <li>Flexible vacation and Kinaxis Days (company-wide days off)<\/li>\n <li>Flexible work options<\/li>\n <li>Physical and mental well-being programs<\/li>\n <li>Regularly scheduled virtual fitness classes<\/li>\n <li>Mentorship programs, training, and career development<\/li>\n <li>Recognition programs and referral rewards<\/li>\n <li>Hackathons<\/li>\n<\/ul>\n<p>For more information, visit the Kinaxis website at www.kinaxis.com or the company\u2019s blog at http://blog.kinaxis.com.<\/p>\n<p>Kinaxis welcomes candidates to apply to our inclusive community. We provide accommodations upon request to ensure fairness and accessibility throughout our recruitment process for all candidates, including those with specific needs or disabilities. If you require an accommodation, please reach out to us at recruitmentprograms@kinaxis.com. This contact information is for accessibility requests only and cannot be used to inquire about the status of applications.<\/p>\n<p><em>Kinaxis is committed to ensuring a fair and transparent recruitment process. We use artificial intelligence (AI) tools in the initial step of the recruitment process to compare submitted resumes against the job description to identify candidates whose education, experience, and skills most closely match the requirements of the role. After the initial screening, all subsequent decisions regarding your application, including final selection, are made by our human recruitment team. AI does not make any final hiring decisions.<\/em><\/p>\n<p>     <\/p>","directApply":true,"datePosted":"2026-10-23T04:00:00.000Z","title":"Senior Payroll Specialist","occupationalCategory":"Finance","@context":"http://schema.org","url":"https://careers-kinaxis.icims.com/jobs/35595/senior-payroll-specialist/job"}</script>
