<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Available jobs - Search - Job Bank</title>
</head>
<body vocab="https://schema.org/" typeof="WebPage">
<main property="mainContentOfPage" typeof="WebPageElement" class="container">
<div class="jobalert-results-group row">
<div class="results-summary ">
<h2><span class="found" id="results-count">0</span> results </h2>
</div>
</div>
<div id="ajaxupdateform:result_block" class="results-jobs">
<div class="noResults">
<h3 role="status">We could not find any results for your search keywords.</h3>
<p class="other-options">You can search by</p>
</div>
<div id="morepage" class="col-md-12 mrgn-tp-md noprint">
<button class="btn btn-default btn-md btn-block" type="button" id="moreresultbutton" onclick="showmore();">
<span class="fas fa-chevron-circle-down"></span> Show more results
</button>
</div>
</div>
</main>
</body>
</html>
