# Employer -> industry codes (SPEC §5.5; DECISIONS D-40; Task 6.3; read by parse/industry.py).
#
# Codes are NAICS 2022 (the edition data/taxonomy/naics.json holds; a test checks every code
# here against it): software publishers are 5132 and newspapers 5131 in this edition (2017's 5112
# and 5111). A sector may be written as NAICS writes it (44-45, 31-33, 48-49).
#
# Order of reading (parse/industry.py):
# 1. `companies`: a curated table of normalised names and aliases. Names are compared casefolded and
#    accent-free, "&" read as "and", periods and apostrophes deleted ("U.S." is "us", "McDonald's"
#    "mcdonalds"), other punctuation read as a space, a bracketed tag dropped ("Postman
#    (Greenhouse)" is an ATS tag from Tailrd's job feed), a leading "the" and trailing
#    `legal_suffixes` removed; each side of a spaced slash is tried ("City of Ottawa / Ville
#    d'Ottawa"); a name the table lacks is tried again without trailing `name_qualifiers` ("Google
#    Canada", "TD Bank Group"). Never by a shorter prefix: "Apple Tree Daycare" is not Apple.
# 2. `rules` over the name (`phrases` and `name_only`), then over the context (a role's first
#    bullet, a posting's company description; `phrases` only, since bullets talk about the work:
#    "a data warehouse", "a CI pipeline", "data mining"). The first rule listed that matches wins,
#    so specific rules come first ("food bank" before "bank", "university" before "temple").
# The table holds the employers most frequent in Tailrd's catalogue (one aggregate read of the
# Development database, company and posting count, top 150, 2026-10-09; names whose industry is
# unclear, such as "Stealth Startup", "ATC" or "DREAM", are left out) and well-known Canadian and
# US employers.
format: 1

legal_suffixes: [inc, incorporated, ltd, limited, llc, llp, lp, corp, corporation, co, company, plc, gmbh,
                 ag, sa, sas, ltee, ulc, pbc, pty, bv, nv, srl, spa, sarl, senc, senccrl]
name_qualifiers: [canada, canadian, usa, us, america, north america, americas, international, global,
                  group, holdings, worldwide, the americas, en canada, in canada, du canada, ca,
                  operations, careers, jobs]

