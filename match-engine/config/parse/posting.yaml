# Words that, in the same clause, show a credential is to be HELD ("RN with 3+ years", "Must hold
# a valid P.Eng. licence", "CPA designation required"); a credential mentioned otherwise ("work
# under RN supervision") is no licence requirement. A credential that opens its clause holds too.
credential_holding:
  - licence
  - license
  - licensed
  - licensure
  - designation
  - designated
  - certification
  - certifications
  - certified
  - certificate
  - registration
  - registered
  - registrable
  - eligible
  - eligibility
  - accreditation
  - accredited
