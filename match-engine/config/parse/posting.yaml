# Job-posting parse tables (SPEC §14.4; Task 6.5; read by parse/posting.py).
#
# Phrases are compared as folded words (case- and accent-insensitive; hyphens and apostrophes split
# words, so "you'll need" is "you ll need" and "nice-to-have" is "nice to have"). Patterns (the
# `*_patterns` keys) are Python regular expressions, compiled case-insensitively at load; a pattern
# that does not compile is refused. Everything English and French.
format: 1

# ─── sections ────────────────────────────────────────────────────────────────────────────────
# A header is a short line (at most `max_header_words` words) whose words, without the filler
# words, are a listed phrase without its filler words: "What You'll Need:", "**Minimum
# Qualifications**", "## Nice to Have", "ATOUTS". "Label: text" on one line opens the section and
# the text after the colon belongs to it. The longest matching phrase decides; on a tie the kind
# listed first here wins (preferred before required: "Preferred Qualifications").
sections:
  max_header_words: 8
  filler: [the, our, your, a, an, and, "&", of, to, for, this, that, what, we, re, are, you, ll,
           will, who, is, in, with, key, s, le, la, les, l, de, des, du, et, vos, votre, nos, notre,
           ce, que, qui, vous]
  preferred:
