# ─── modal phrases (SPEC §14.4 "requirements buried in prose") ───────────────────────────────
# A clause's own phrase decides its necessity; see parse/posting.py for how a clause without one
# inherits. `preferred` is checked before `required` ("Python is required; Go is a plus" splits at
# the ";"), and a clause holding both reads as preferred ("must have ... is a plus" is rare and
# the softer reading cannot invent a requirement). `implied` phrases (interest, learning,
# opportunity) make the clause IMPLIED wherever it is: "Willingness to learn Kubernetes" names no
# requirement. `negated` phrases make the clause IMPLIED too: "No Rust experience required".
modals:
  required:
    - must
    - must have
    - required
    - requires
    - require
    - requirement
    - requirements
    - mandatory
    - minimum
    - at least
    - essential
    - necessary
    - you have
    - you ve got
    - you possess
    - you bring
    - you ll need
    - you will need
    - you need
    - need to have
    - needs to have
    - should have
    - should possess
    - you must
    - currently pursuing
    - currently enrolled
    - enrolled in
    - pursuing a
    - doit
    - doivent
    - devez
    - requis
    - requise
    - requises
    - exige
    - exigee
    - exiges
    - exigees
    - obligatoire
    - obligatoires
    - essentiel
    - essentielle
    - au moins
    - minimum de
    - vous avez
    - vous possedez
    - vous detenez
    - vous maitrisez
  preferred:
    - nice to have
    - good to have
    - bonus
    - bonus points
    - preferred
    - preferably
    - preference
    - ideally
    - a plus
    - is a plus
    - are a plus
    - big plus
    - huge plus
    - definite plus
    - strong plus
    - pluses
    - an asset
    - asset
    - assets
    - desirable
    - desired
    - advantageous
    - an advantage
    - beneficial
    - helpful
    - would be great
    - would be nice
    - un atout
    - atout
    - atouts
    - un plus
