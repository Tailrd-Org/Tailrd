# Negation and aspiration (SPEC §15.2), never crossing a clause boundary (verbs.yaml clause
# rules). Terms are quoted on purpose: YAML 1.1 would read a bare `no` as false, `on` as true.

# The aspiration window: tokens scanned before a skill mention (DECISIONS D-34c).
window_tokens: 6

hard_negation:
  m: 0.0
  terms: ["not", "no", "without", "lacking", "never", "no experience"]
  # A hard term negates a skill only when every token between them is one of these (or another
  # skill, or an aspiration term): "no prior experience with Java". Otherwise it governs the
  # noun it opens: "with no downtime using Kubernetes" (DECISIONS D-34c). "use", "work" and
  # "have" complete the paradigm for "didn't use", "haven't worked", "don't have"; the ordinary
  # modifiers from "direct" on keep "No production experience with X" and "Not very familiar
  # with X" negated, while "no production downtime using X" still affirms X.
  scope_fillers: ["experience", "knowledge", "prior", "previous", "professional", "formal",
                  "hands-on", "working", "real-world", "familiarity", "exposure", "background",
                  "expertise", "skills", "proficiency", "familiar", "proficient", "experienced",
                  "comfortable", "skilled", "used", "worked", "using", "with", "in", "of", "on",
                  "at", "to", "any", "the", "a", "an", "use", "work", "have",
                  "direct", "practical", "commercial", "industry", "production", "real",
                  "extensive", "significant", "relevant", "much", "very", "really", "fully",
                  "currently", "previously", "before", "once", "too"]
  # Phrases whose negation word negates nothing: "Not only built the API in Go".
  exceptions: ["not only"]

aspirational:
  # Interest is not experience.
  m: 0.15
  terms: ["seeking", "aspiring", "looking to", "interested in", "eager to learn",
          "currently learning", "studying", "hope to", "want to"]
