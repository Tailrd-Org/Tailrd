# casing, prose extraction needs it away from a sentence start, skills lists accept any casing).
# Ordinary words and abbreviations a curated alias would otherwise catch in any casing go here too
# (D-27): "10 mL" (ML), "hospital bed" (BEd), "j'ai" (AI), "bi-weekly" (BI), "les os" (OS),
# "j'ai mis" (MIS), "a marketing maven", "economic tailwinds", "Ajax, ON" (AJAX).
