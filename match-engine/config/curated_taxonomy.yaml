# Tailrd's curated layer of the skill taxonomy (Task 2.2; SPEC §3; DECISIONS D-13, D-20).
#
# Read by scripts/build_taxonomy.py together with ESCO and O*NET (data/raw/). Curated nodes win:
# an ESCO concept, an O*NET example or an O*NET commodity class whose name normalises to a label or
# alias below MERGES into that node (aliases unioned; the label, kind, parents and release year
# here are final). Curated labels and aliases are exempt from every alias filter.
#
# Node fields: id, label, kind (TECHNOLOGY | METHODOLOGY | DOMAIN | TOOL | SOFT | CREDENTIAL),
# aliases, parents, release_year. `parents` omitted: the node inherits the parents of what merged
# into it (ESCO broader concepts, O*NET commodity classes); `parents: []`: a root.
#
# The first block carries Tailrd's tables verbatim in content: every key of
# backend/services/structured_extraction.py:_SKILL_SYNONYMS with its synonyms as aliases, the
# display names of backend/services/local_match.py:_DISPLAY as labels, and local_match.IMPLIES as
# parents ("postgresql implies sql" -> skill.postgresql has parent skill.sql). Four tags became
# fields of study (data science, statistics, marketing, accounting: see `fields`).
#
# Quote YAML words that would parse as booleans or numbers (yes, no, on, off, 365).
format: 1

