# Phrases that are never skills although they contain one (D-27): in extraction a match consumes
# its words and yields no mention ("American Express" is no Express.js); `resolve` gives NONE. The
# longest match wins, and a blocked phrase wins a tie. "[A-Z]" stands for each capital letter.
blocked_phrases: [American Express, Express Entry, Express Scripts, Sous Chef, Chef de partie,
  Chef de cuisine, Executive Chef, Pastry Chef, Head Chef, "Vitamin [A-Z]", "Building [A-Z]",
  Hepatitis C, Hep C, Schedule C, Swift Current, Swift Water, Spring Break, Spring Term,
  Spring Semester, Go-Live, Go-to-market, Go/No-Go, R&D, Unity Health, Epic Games, Swift Transportation,
  Express Employment Professionals, NCLEX-RN, Statistics Canada, Department of Finance,
  # section headers that would otherwise read as a skill ("Technical Skills:")
  Technical Skills, Language Skills, Platforms]

# Professional licences (config/gates.yaml) -> the credential of their formal in-progress
# designations (D-28). The build fails when a licence has none, or when one of those names reaches
# a licence through the resolver. The CFA charter is no gated licence, but its candidacy ("CFA
# Level II") is as formal a designation: read only as written, and never as the charter.
in_progress:
  cred.cfa: cred.cfa_candidate
  cred.registered_nurse: cred.nursing_student
  cred.licensed_practical_nurse: cred.nursing_student
  cred.cpa: cred.cpa_in_progress
  cred.commercial_drivers_license: cred.cdl_trainee
  cred.professional_engineer: cred.eit
  cred.bar_admission: cred.articling_student
  cred.medical_license: cred.medical_student
  cred.pharmacist_license: cred.pharmacy_student
  cred.teaching_license: cred.teacher_candidate
  cred.electrician_license: cred.electrician_apprentice
  cred.paramedic_license: cred.paramedic_student

# Posting lines that require a professional licence: [line, licence, other credentials it names].
# The build fails unless the line yields exactly those credentials ("candidate" in a posting is
# the applicant, never an in-progress status; D-28).
licence_probes:
  - ["Ideal candidate: RN with 3+ years of acute care experience.", cred.registered_nurse]
  - ["What we look for in a candidate: RN, BScN preferred.", cred.registered_nurse]
  - ["Ideal Candidate - Registered Nurse (RN) with current CNO registration.", cred.registered_nurse]
  - ["The ideal candidate: P.Eng. or EIT with five years of design experience.", cred.professional_engineer, cred.eit]
  - ["Preferred candidate: Ontario Certified Teacher with ESL Part 1.", cred.teaching_license]
  - ["Graduate of an accredited RN program with current registration.", cred.registered_nurse]
  - ["Candidate must hold a CPA designation.", cred.cpa]
  - ["Successful candidate: licensed 309A electrician.", cred.electrician_license]

