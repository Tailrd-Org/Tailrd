# 100 hand-written résumé bullets with labelled skill mentions (SPEC §15.2: "Test both against a
# fixture file of 100 hand-written bullets with labeled expected multipliers").
#
# Labels come from SPEC §15 and DECISIONS D-32, D-33, D-34a..D-34f, never from the implementation:
#   clauses   split at . ; , and the whole words and/but/or/nor/yet/so (any case); "for" never
#             splits; punctuation inside a word or number (Node.js, 3.5, 1,000), the period of an
#             abbreviation (U.S., e.g., Inc.), "yet" right after a negation and anything inside a
#             mention span ("Research and Development") are not boundaries.
#   verb      the nearest verbs.yaml entry that ends before the mention inside its clause;
#             words inside a mention are skill names, not verbs; base and third-person forms
#             (design, support, engineers) count only as the clause's first word or after "to",
#             noun entries (exposure, ...) only before of/to/with/in (D-34e); a verb chained to an
#             earlier one by nothing or to/in/with/on takes the head's class ("Helped to build"
#             -> helped, D-34d); "using"/"utilizing"/... defer to an earlier verb of the clause.
#   inherit   a clause with no verb continues the previous clause when it holds only mentions,
#             list words (and, or, &, as well as, plus, including, with), articles and
#             punctuation (D-34a), or follows and/or/nor (D-34f): it takes the previous clause's
#             verb class, and its polarity only from a mention there, never across . ; ! ? or
#             but/yet (D-34b). Otherwise NO_VERB.
#   polarity  hard negation reaches a mention only across scope fillers (experience, with,
#             used, ...), other mentions or aspiration terms (D-34c); "not only" and hyphenated
#             compounds ("no-code") never negate; "n't" is "not". Aspiration: the 6 tokens before
#             the mention inside its clause (a mention is one token, punctuation none), a
#             multi-word term only whole inside the window. Hard negation wins.
#   quantified  is_quantified(text) (the ROLE_BULLET_QUANTIFIED test, bullet level).
#   multiplier  closed form: E = verb multiplier (OWNERSHIP 1.00, EXECUTION 0.85, PARTICIPATION
#             0.65, ASSISTANCE 0.45, EXPOSURE 0.30, NO_VERB 0.70); quantified -> min(1.0, E x
#             1.15); NEGATED -> 0.0; ASPIRATIONAL -> min(E, 0.15).
#
# Each mention's `surface` is located in `text` by the test (whole-word match; `occurrence`,
# 1-based, when it repeats). Strings are quoted: YAML 1.1 reads a bare `no` as false.

