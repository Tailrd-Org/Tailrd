<form id="application-form" class="application-form"><div class="application-question"><label><div class="application-label multiple-choice">Race</div><div class="application-field">  <ul data-qa="multiple-choice"><li><label><input type="radio" name="eeo[race]" value="Hispanic or Latino"><span class="eeo-option-text application-answer-alternative">Hispanic or Latino</span><div class="eeo-option-description">A person of Cuban, Mexican, Puerto Rican, South or Central American, or other Spanish culture or origin regardless of race.</div></label></li><li><label><input type="radio" name="eeo[race]" value="White (Not Hispanic or Latino)"><span class="eeo-option-text application-answer-alternative">White (Not Hispanic or Latino)</span><div class="eeo-option-description">A person having origins in any of the original peoples of Europe, the Middle East, or North Africa.</div></label></li><li><label><input type="radio" name="eeo[race]" value="Black or African American (Not Hispanic or Latino)"><span class="eeo-option-text application-answer-alternative">Black or African American (Not Hispanic or Latino)</span><div class="eeo-option-description">A person having origins in any of the black racial groups of Africa.</div></label></li><li><label><input type="radio" name="eeo[race]" value="Native Hawaiian or Other Pacific Islander (Not Hispanic or Latino)"><span class="eeo-option-text application-answer-alternative">Native Hawaiian or Other Pacific Islander (Not Hispanic or Latino)</span><div class="eeo-option-description">A person having origins in any of the peoples of Hawaii, Guam, Samoa, or other Pacific Islands.</div></label></li><li><label><input type="radio" name="eeo[race]" value="Asian (Not Hispanic or Latino)"><span class="eeo-option-text application-answer-alternative">Asian (Not Hispanic or Latino)</span><div class="eeo-option-description">A person having origins in any of the original peoples of the Far East, Southeast Asia, or the Indian Subcontinent, including, for example, Cambodia, China, India, Japan, Korea, Malaysia, Pakistan, the Philippine Islands, Thailand, and Vietnam.</div></label></li><li><label><input type="radio" name="eeo[race]" value="American Indian or Alaska Native (Not Hispanic or Latino)"><span class="eeo-option-text application-answer-alternative">American Indian or Alaska Native (Not Hispanic or Latino)</span><div class="eeo-option-description">A person having origins in any of the original peoples of North and South America (including Central America), and who maintain tribal affiliation or community attachment.</div></label></li><li><label><input type="radio" name="eeo[race]" value="Two or More Races (Not Hispanic or Latino)"><span class="eeo-option-text application-answer-alternative">Two or More Races (Not Hispanic or Latino)</span><div class="eeo-option-description">All persons who identify with more than one of the above five races.</div></label></li><li><label><input type="radio" name="eeo[race]" value="Decline to self-identify"><span class="eeo-option-text application-answer-alternative">Decline to self-identify</span></label></li></ul></div></label></div></form>
